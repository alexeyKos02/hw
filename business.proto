syntax = "proto3";

package business;

service BusinessService {
    rpc Create(BusinessRequest) returns (BusinessResponse) {}
    rpc Get(GetRequest) returns (BusinessResponse) {}
    rpc Update(UpdateRequest) returns (BusinessResponse) {}
    rpc Delete(DeleteRequest) returns (BusinessResponse) {}
}

message BusinessRequest {
    string data = 1;
}

message GetRequest {
    int32 id = 1;
}

message UpdateRequest {
    int32 id = 1;
    string data = 2;
}

message DeleteRequest {
    int32 id = 1;
}

message BusinessResponse {
    string message = 1;
}
